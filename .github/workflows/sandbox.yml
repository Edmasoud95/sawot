name: Sandbox controls
on:
  pull_request:
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s sandbox/tests -v
      - run: echo 'Unit checks only. Live gVisor isolation is NOT verified by this job.'
  image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sawot-python-verification sandbox/image
      - run: echo 'Image build only. Enablement additionally requires the host live verifier.'
