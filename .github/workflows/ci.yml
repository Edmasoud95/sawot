name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner -v --log-opts="--all" .

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ts-backend/package-lock.json
            web/package-lock.json
      - name: Backend
        working-directory: ts-backend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Backend and frontend regression tests
        working-directory: ts-backend
        run: node --import tsx --test tests/*.test.ts ../web/tests/*.test.ts

  windows-proxy-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firewall script regression tests (isolated OS commands)
        shell: powershell
        run: ./scripts/tests/windowsHttps.test.ps1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Skip kokoro (pulls torch) and the CUDA libraries — the tests fake
        # the TTS pipeline and run STT/TTS logic on CPU stubs. ffmpeg is
        # needed by the audio-decode tests.
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          grep -vE '^(kokoro|nvidia)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt pytest pytest-asyncio
      - name: Tests
        run: pytest
