# Copy to config.yaml and fill in your values.
home_assistant:
  url: "http://192.168.1.10:8123"     # Home Assistant URL
llm:                            # built-in model server
  url: "http://192.168.1.11:1234/v1"  # any OpenAI-compatible /v1 endpoint
  model: "gemma-4"                     # any tool-calling model it serves
stt:
  model: "cohere-transcribe"           # STT model id (see Settings for the list)
  language: "en"                      # transcription language
tts:
  voice: "af_heart"                   # any Kokoro voice in the UI list
  lang_code: "a"                      # Kokoro language code ('a' = American English)
assistant:
  name: "Rita"                        # assistant name/persona
  personality: "sassy"                # "sassy" or "plain"
server:
  host: "0.0.0.0"                     # use "127.0.0.1" to restrict to localhost
  port: 8765
# controls:                            # optional service whitelist override
#   light: ["turn_on", "turn_off"]
#   switch: ["turn_on", "turn_off"]
#   media_player: ["turn_on", "turn_off"]
#   climate: ["set_temperature"]
tls:
  # Optional; required for phone microphone access over https.
  certfile: "certs/voice.crt"
  keyfile: "certs/voice.key"
