# Quick start:
#   cp .env.example .env      # optionally set your model-server URL
#   docker compose up -d
# then open http://localhost:8765 and download the speech models from Settings.
#
# The model server (any OpenAI-compatible endpoint) runs outside the
# container; host.docker.internal points at the machine running Docker.
services:
  sawot:
    image: ghcr.io/edmasoud95/sawot:latest
    build: .
    ports:
      - "8765:8765"
    environment:
      # Upgrade migration only; configure Home Assistant and credentials in Settings.
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      ASSISTANT_PERSONALITY: ${ASSISTANT_PERSONALITY:-sassy}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
