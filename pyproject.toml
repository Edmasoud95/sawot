[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sawot"
version = "0.1.0"
description = "Fully local voice and chat assistant for Home Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ed Masoud" }]
keywords = ["home-assistant", "voice", "llm", "stt", "tts", "local", "openai"]
dependencies = [
  "fastapi",
  "python-multipart",
  "uvicorn[standard]",
  "httpx",
  "openai",
  "pyyaml",
  "python-dotenv",
  "transcribe-cpp",
  "kokoro>=0.9",
  "soundfile",
  "numpy",
  "pypdf",
  "huggingface-hub",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
sawot-sidecar = "sidecar.main:main"

[tool.setuptools]
packages = ["server", "sidecar"]
